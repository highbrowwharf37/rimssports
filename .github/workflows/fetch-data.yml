name: Fetch CBB Data
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch Barttorvik data
        env:
          CBB_DATA_API_KEY: ${{ secrets.CBB_API_KEY }}
        run: python3 merge.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update CBB data"
            git pull --rebase origin "ishaan's-cbb"
            git push
          fi
